<style>
html { scrollbar-gutter: stable; } /* the scrollbar appearing must not shove the layout sideways */
body { background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 560px; z-index: -1; pointer-events: none;
  background: radial-gradient(60% 100% at 15% 0%, color-mix(in srgb, var(--brand-100) 80%, transparent), transparent 70%); }
a.btn { text-decoration: none; }
.top { position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; padding: var(--sp-3) var(--gutter);
  background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.logo { display: flex; align-items: center; gap: var(--sp-3); font-weight: 700; font-size: var(--fs-title); margin-right: var(--sp-6); }
.logo-mark { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: var(--sh-accent); }
.logo small { display: block; font-size: var(--fs-caption); font-weight: 500; color: var(--text-3); line-height: 1.2; }
a.seg-item { display: inline-flex; align-items: center; text-decoration: none; }
.seg-pill { transition: transform var(--dur-2) var(--ease-out), width var(--dur-2) var(--ease-out); }
.top-end { margin-left: auto; display: grid; grid-template-columns: 210px 64px 36px 84px; align-items: center; gap: var(--sp-3); }
.lang-sel { min-height: var(--h-sm); padding: 0 var(--sp-2); border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 600; font-size: var(--fs-label); }
.top-end #logout { justify-self: end; }
.mon { display: flex; align-items: center; gap: var(--sp-1); padding: var(--sp-1); border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--sh-1); }
.mon button { width: var(--h-sm); height: var(--h-sm); display: grid; place-items: center; border-radius: var(--r-sm); color: var(--text-2); transition: background-color var(--dur-1), color var(--dur-1); }
.mon button:hover:not(:disabled) { background: var(--surface-sunken); color: var(--text); }
.mon button:disabled { opacity: .35; cursor: default; }
.mon span { min-width: 112px; text-align: center; font-weight: 600; font-size: var(--fs-body); }
.flag svg { flex: none; margin-right: var(--sp-1); }
.back svg { margin-right: 2px; }
.wrap { max-width: var(--container); margin: 0 auto; padding: var(--sp-8) var(--gutter) var(--sp-16); }
.wrap.wide { max-width: 1480px; }
#app[aria-busy="true"] { opacity: .55; transition: opacity var(--dur-2) var(--ease-out) .15s; pointer-events: none; }
.skel { min-height: 100vh; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-6); }
.head p { margin-top: var(--sp-1); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-6); }
.kpi .t-kpi { margin: var(--sp-2) 0; }
.kpi .unit { font-size: var(--fs-title); color: var(--text-3); font-weight: 600; letter-spacing: 0; }
.kpi.alert .t-kpi { color: var(--danger-600); }
.tools { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
.tools .input { width: auto; min-height: var(--h-sm); padding: 0 var(--sp-3); border-radius: var(--r-sm); }
.tools .grow { flex: 1; min-width: 200px; }
.tablecard { padding: 0; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: var(--sp-3) var(--sp-4); text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: var(--fs-label); font-weight: 600; color: var(--text-3); background: var(--surface); }
.th-sort { display: inline-flex; align-items: center; gap: var(--sp-1); min-height: var(--h-sm); font: inherit; color: inherit; border-radius: var(--r-xs); }
.th-sort:hover { color: var(--text); }
th.r .th-sort { margin-left: auto; }
th.r { text-align: right; }
.th-sort .arr { min-width: 1ch; }
.row-link { font-weight: 600; color: var(--text); text-decoration: none; }
.row-link:hover { color: var(--accent); }
td mark { background: color-mix(in srgb, var(--warning-600) 24%, transparent); color: inherit; border-radius: 3px; }
th.r, td.r { text-align: right; }
tbody tr { transition: background-color var(--dur-1); }
tbody tr[data-id]:hover { background: var(--n-25); cursor: pointer; }
tbody tr.dim td { color: var(--text-3); }
tr:last-child td { border-bottom: 0; }
td .sub { display: block; font-size: var(--fs-caption); color: var(--text-3); max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
.chipv { display: inline-block; min-width: 44px; padding: var(--sp-1) var(--sp-2); line-height: 1.2; border-radius: var(--r-xs); text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--on-accent); }
.chart-card { display: flex; flex-direction: column; }
.chart { display: block; width: 100%; flex: 1; min-height: 200px; overflow: visible; }
.chart .gl { stroke: var(--border); }
.chart text { font-size: var(--fs-caption); fill: var(--text-3); font-family: var(--font); }
.hbars .row { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-4); }
.hbars .row:last-child { margin-bottom: 0; }
.hbars .row small { color: var(--text-3); font-weight: 500; }
.trk { grid-column: 1 / -1; height: 8px; border-radius: var(--r-full); background: var(--surface-sunken); overflow: hidden; }
.trk i { display: block; height: 100%; width: 0; border-radius: inherit; transition: width var(--dur-4) var(--ease-out); }
.inbox { display: grid; grid-template-columns: 340px 1fr; padding: 0; overflow: hidden; }
.inbox-list { border-right: 1px solid var(--border); max-height: 520px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--n-300) transparent; }
.inbox-tabs .tab { white-space: nowrap; }
.inbox-tabs { position: sticky; top: 0; z-index: 1; padding: var(--sp-3) var(--sp-4); background: var(--surface); border-bottom: 1px solid var(--border); }
.list-item .item-meta { margin-bottom: var(--sp-1); }
.item-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.detail { display: flex; flex-direction: column; min-height: 420px; padding: var(--sp-6); }
.who { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-5); }
.avatar { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: var(--r-sm); background: var(--surface-sunken); color: var(--text-2); font-weight: 700; }
.quote { margin: 0 0 var(--sp-5); padding: var(--sp-5); border-radius: var(--r-md); background: var(--surface-sunken); }
.mini-scores { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-5); }
.mini-scores div { padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-sm); }
.mini-scores b { display: block; font-size: var(--fs-h3); }
.detail .go { margin-top: auto; align-self: flex-start; }
.grid2.rev { grid-template-columns: 1fr 1.6fr; }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.qrow { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-4); }
.qrow:last-child { margin-bottom: 0; }
.bar { grid-column: 1 / -1; height: 8px; border-radius: var(--r-full); background: var(--surface-sunken); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.trend { display: flex; align-items: flex-end; gap: var(--sp-3); height: 180px; }
.trend div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: var(--sp-1); height: 100%; }
.trend b { display: block; width: 100%; max-width: 40px; border-radius: var(--r-xs) var(--r-xs) 0 0; background: var(--accent-soft-2); }
.trend div.cur b { background: var(--accent); }
.list .item { padding: var(--sp-4) 0; border-bottom: 1px solid var(--border); }
.list .item:last-child { border-bottom: 0; }
.item-meta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-2); }
.item-meta a { color: var(--text); font-weight: 600; text-decoration: none; }
.item-meta a:hover { color: var(--accent); }
.dev { display: flex; align-items: center; gap: var(--sp-1); flex-wrap: wrap; margin-top: var(--sp-2); }
.flag { display: inline-flex; margin: 0 var(--sp-2) var(--sp-2) 0; white-space: normal; }
.empty { padding: var(--sp-8); text-align: center; }
.back { display: inline-flex; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-4); color: var(--text-2); text-decoration: none; font-weight: 600; }
.back:hover { color: var(--text); }
dialog { width: min(520px, calc(100vw - 32px)); padding: var(--sp-6); border: 0; border-radius: var(--r-lg); box-shadow: var(--sh-3); }
dialog::backdrop { background: rgba(18, 25, 22, .32); }
dialog form { display: grid; gap: var(--sp-4); }
.row-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-2); }
.check { display: flex; align-items: center; gap: var(--sp-2); font-weight: 600; }
.check input, td input[type=checkbox], th input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.login { max-width: 400px; margin: 12vh auto 0; }
.login-lang { margin-bottom: var(--sp-6); }
.login-sub { margin-top: var(--sp-1); }
.section-head { margin: var(--sp-8) 0 var(--sp-3); }
.staff-name { margin-top: var(--sp-2); }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.item-meta .when { margin-left: auto; white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini-scores .bad { color: var(--danger-600); display: inline-flex; align-items: center; gap: var(--sp-1); }
.item-comment { margin-top: var(--sp-2); line-height: 1.6; overflow-wrap: anywhere; }
.detail .dev { margin-bottom: var(--sp-5); }
.login form { display: grid; gap: var(--sp-4); margin-top: var(--sp-6); }
.dept-in { min-height: var(--h-sm); padding: 0 var(--sp-3); border-radius: var(--r-sm); min-width: 220px; }
.dept-in:placeholder-shown { border-color: color-mix(in srgb, var(--warning-600) 45%, transparent); background: var(--warning-50); }
.err { color: var(--danger-600); font-size: var(--fs-label); font-weight: 600; min-height: 1.4em; }

/* printable A4 poster, a close match of the center's own blue poster: one SVG art layer (waves, photo, band) in mm, live text and a real QR on top */
.posters { display: grid; gap: var(--sp-8); justify-content: center; }
.poster { --navy: #0B2A6F; --blue: #1D5FE0; --sky: #3D8BFF; --ink: #10204A;
  position: relative; width: 210mm; height: 297mm; overflow: hidden; background: #fff; color: var(--ink); font-family: var(--font); box-shadow: var(--sh-3); }
.pz-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.pz-photo { position: absolute; left: 96mm; top: 48mm; width: 114mm; height: 196mm; object-fit: cover; clip-path: polygon(100.00% 0.00%, 94.05% 0.41%, 88.25% 0.97%, 82.60% 1.68%, 77.12% 2.55%, 71.80% 3.57%, 66.67% 4.74%, 61.73% 6.06%, 56.99% 7.53%, 52.47% 9.14%, 48.16% 10.90%, 44.09% 12.81%, 40.25% 14.86%, 36.66% 17.05%, 33.33% 19.39%, 30.04% 22.07%, 26.94% 24.88%, 24.03% 27.80%, 21.30% 30.84%, 18.77% 33.98%, 16.42% 37.22%, 14.25% 40.56%, 12.28% 44.00%, 10.49% 47.52%, 8.90% 51.13%, 7.49% 54.82%, 6.27% 58.59%, 5.23% 62.42%, 4.39% 66.33%, 1.75% 97.96%, 1.75% 100.00%, 100.00% 100.00%); }
.pz-mark { position: absolute; top: 12mm; right: 12mm; width: 32mm; height: 32mm; border-radius: 50%; display: grid; place-items: center; background: #fff;
  box-shadow: 0 2.5mm 6mm -2mm rgba(16, 32, 74, .35); }
.pz-mark svg { width: 16mm; height: 16mm; }
.pz-col { position: absolute; top: 14mm; left: 15mm; width: 124mm; display: flex; flex-direction: column; }
.pz-title { margin: 0; font-family: Oswald, var(--font); font-weight: 700; text-transform: uppercase; line-height: 1.02; letter-spacing: .15mm; color: var(--navy); font-size: 15mm; text-wrap: balance; }
.pz-title em { display: block; white-space: nowrap; font-style: normal; color: var(--blue); font-size: 21mm; line-height: 1; letter-spacing: .2mm; }
.pz-pulse { display: block; width: 104mm; height: 6mm; margin: 3mm 0 2.5mm; color: var(--blue); }
.pz-pulse svg { width: 100%; height: 100%; }
.pz-sub { margin: 0; font-size: 4.5mm; line-height: 1.35; font-weight: 600; color: var(--ink); }
.pz-qr { margin-top: 6mm; width: 100mm; }
.pz-tab { display: flex; align-items: center; gap: 4mm; width: 74mm; box-sizing: border-box; padding: 3.2mm 5mm; border-radius: 4.5mm 4.5mm 0 0; background: var(--navy); color: #fff;
  font-size: 4.5mm; font-weight: 600; line-height: 1.25; }
.pz-tab svg { width: 7.5mm; height: 11mm; flex: none; }
.pz-card { background: #fff; border: 1mm solid var(--blue); border-radius: 0 8mm 8mm 8mm; padding: 4.5mm; box-shadow: 0 4mm 10mm -4mm rgba(16, 32, 74, .35); }
.pz-code svg { display: block; width: 100%; height: auto; }
.pz-name { margin-top: 3.5mm; padding-top: 3mm; border-top: .3mm dashed #B9CBEF; }
.pz-name b { display: block; font-size: 5.2mm; line-height: 1.2; font-weight: 700; color: var(--navy); }
.pz-name span { display: block; margin-top: .8mm; font-size: 3.6mm; line-height: 1.3; color: #3A4A70; }
.pz-band { position: absolute; left: 6mm; right: 6mm; top: 245mm; height: 28mm; margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); }
.pz-band li { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: 1.6mm; padding: 0 2mm; color: #fff; }
.pz-band li + li { border-left: .3mm solid rgba(255, 255, 255, .3); }
.pz-band li svg { width: 15mm; height: 15mm; }
.pz-band b { font-family: Oswald, var(--font); font-weight: 600; font-size: 4.1mm; line-height: 1.1; text-wrap: balance; letter-spacing: .1mm; text-transform: uppercase; }
.pz-band li::after { content: ""; width: 9mm; height: .8mm; border-radius: 1mm; background: var(--sky); margin-top: auto; }
.poster .pz-hi { stroke: var(--sky); } .poster .pz-fill { fill: var(--sky); stroke: var(--sky); }
.pz-thanks { position: absolute; left: 0; right: 30mm; top: 278.6mm; margin: 0; text-align: center; color: var(--blue); font: 400 7.4mm/1.15 Pacifico, "Segoe Script", cursive; }
.pz-url { position: absolute; left: 0; right: 30mm; top: 291.4mm; margin: 0; text-align: center; font-size: 2.4mm; color: #7A87A8; letter-spacing: .02em; }
@media print {
  @page { size: A4; margin: 0; }
  body { background: var(--surface); }
  .top, .noprint { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .posters { display: block; }
  .poster { box-shadow: none; break-after: page; zoom: 1 !important; }
  .poster:last-child { break-after: auto; }
  /* blurred shadows turn into grey boxes in Chrome's PDF output */
  .pz-card { box-shadow: none; } .pz-mark { box-shadow: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media (max-width: 1020px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid2, .grid2.rev { grid-template-columns: 1fr; } .inbox { grid-template-columns: 1fr; } .inbox-list { max-height: 320px; border-right: 0; border-bottom: 1px solid var(--border); } }
@media (max-width: 760px) {
  .tools .input, .tools .grow { flex: 1 1 100%; min-width: 0; max-width: 100%; }
  /* the wide table scrolls inside its card; the name column stays pinned so rows stay readable */
  .tablecard th:first-child, .tablecard td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--border); }
  .tablecard td:first-child { white-space: normal; min-width: 150px; max-width: 52vw; line-height: 1.3; }
  .tablecard td:first-child .sub { white-space: nowrap; margin-top: var(--sp-1); }
  .tablecard th, .tablecard td { padding: var(--sp-3); }
  td .row-link { display: inline-block; padding: var(--sp-3) 0; margin: calc(-1 * var(--sp-3)) 0; }
  .head .btn { width: 100%; }
  .back { padding: var(--sp-2) 0; margin-top: calc(-1 * var(--sp-2)); }
}
@media (max-width: 560px) {
  .top { position: static; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "logo theme out" "nav nav nav" "mon mon lang"; gap: var(--sp-3) var(--sp-2); }
  .top-end { display: contents; }
  .logo { grid-area: logo; margin: 0; } .logo small { display: none; } .seg { grid-area: nav; } .seg-item { flex: 1; justify-content: center; padding: 0 var(--sp-2); }
  .mon { grid-area: mon; } .mon span { flex: 1; min-width: 0; } #lang { grid-area: lang; width: 72px; } #theme { grid-area: theme; } #logout { grid-area: out; }
  .theme-btn, .mon button { width: 40px; height: 40px; } .lang-sel { min-height: 48px; }
  .kpis { gap: var(--sp-2); } }

/* people page */
[hidden] { display: none !important; }

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (msg, ms = 2400) => { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms); };
const RATE = [1, 2, 3, 4, 5].map((n) => `var(--rate-${n})`);
const rc = (v) => RATE[Math.max(0, Math.min(4, Math.round(v) - 1))];
const fmt = (v, d = 1) => (v === null || v === undefined ? '—' : (+v).toFixed(d));
const npsC = (v) => (v === null ? 'var(--n-500)' : v >= 50 ? RATE[4] : v >= 0 ? RATE[3] : v >= -30 ? RATE[1] : RATE[0]);
const chip = (v, c, txt) => `<span class="chipv" style="background:${v === null ? 'var(--n-500)' : c}">${txt}</span>`;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const initials = (n) => n.split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase();
const ICON = {
  back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  tel: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  dev: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
};

/* ---------- language ---------- */
let L = (() => { try { return localStorage.getItem('fikr-lang') || 'uz'; } catch { return 'uz'; } })();
if (!I18N.LANGS.includes(L)) L = 'uz';
const t = (key, p) => I18N.t(L, key, p);
const tpl = (k) => ME.templates[k]?.[L] || ME.templates[k]?.uz || k;
const qtext = (q) => q[L] || q.uz;
const optL = (opt, v) => opt[v]?.[L] || opt[v]?.uz || v;
const monthName = (m) => `${cap(I18N.month(L, +m.slice(5)))} ${m.slice(0, 4)}`;
const monthShort = (m) => I18N.month(L, +m.slice(5)).slice(0, 3);
// "2026-10-19 22:33:05" → "Bugun, 22:33" / "Kecha, 09:10" / "19-oktabr, 22:33"
function dayLabel(day) {
  const y = new Date(Date.parse(ME.today) - 864e5).toISOString().slice(0, 10);
  return day === ME.today ? t('Bugun') : day === y ? t('Kecha') : I18N.date(L, +day.slice(8), +day.slice(5, 7));
}
const when = (ts, short) => (short && ts.slice(0, 10) !== ME.today ? dayLabel(ts.slice(0, 10)) : `${dayLabel(ts.slice(0, 10))}, ${ts.slice(11, 16)}`);
const LANGN = () => ({ uz: t('Oʻzbekcha (lotin)'), oz: t('Oʻzbekcha (kirill)'), qq: t('Qoraqalpoqcha'), ru: t('Ruscha') });
const devText = (r) => [r.dev_model && r.dev_model !== 'Nomaʼlum' ? r.dev_model : t('Nomaʼlum qurilma'), r.dev_os, r.dev_screen && t('ekran {s}', { s: r.dev_screen })].filter(Boolean).join(', ')
  + '. ' + t('Qurilma belgisi: {id}', { id: r.dev_id });

// lists show a masked number; one tap reveals it as a call link (DESIGN.md: never a full number at a glance)
const telFull = (p) => p.replace(/^\+998(\d{2})(\d{3})(\d{2})(\d{2})$/, '+998 $1 $2 $3 $4');
const telCall = (p) => `<a class="btn btn-secondary btn-sm cm-tel" href="tel:${esc(p)}" title="${esc(t('Qoʻngʻiroq qilish'))}">${ICON.tel}<span class="num">${esc(telFull(p))}</span></a>`;
const telHtml = (r) => r.phone
  ? `<button type="button" class="cm-tel masked" data-tel="${esc(r.phone)}" title="${esc(t('Raqamni koʻrsatish'))}">${ICON.tel}<span class="num">${esc(r.phone.replace(/^\+998(\d{2})\d{5}(\d{2})$/, '+998 $1 *** ** $2'))}</span></button>`
  : `<span class="cm-anon">${t('Anonim bemor')}</span>`;
document.addEventListener('click', (e) => { const b = e.target.closest('button.cm-tel[data-tel]'); if (b) b.outerHTML = telCall(b.dataset.tel); });

function applyStatic() {
  document.documentElement.lang = I18N.HTML_LANG[L];
  $$('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  $$('[data-t-aria-label]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.tAriaLabel)));
  $('#lang').value = L;

/* ---------- data ---------- */
let ME = null, STATS = null, sortK = 'n', sortDir = -1;
const app = $('#app');
const month = () => $('#month').value || ME.month;

async function api(p, opt = {}) {
  const r = await fetch('/api/' + p, { method: opt.method || 'GET', headers: opt.body ? { 'Content-Type': 'application/json' } : {}, body: opt.body && JSON.stringify(opt.body) });
  if (r.status === 401 && p !== 'login') { login(); throw new Error('auth'); }
  if (!r.ok) throw Object.assign(new Error('http ' + r.status), { status: r.status });
  return r.json();
}

function login() {
  try { localStorage.removeItem('fikr-auth'); } catch {}
  $('#top').hidden = true;
  app.innerHTML = `<div class="card login"><div class="login-lang tabs" role="group" aria-label="${esc(t('Til'))}">${['uz', 'oz', 'qq', 'ru'].map((k) => `<button type="button" class="tab" data-l="${k}" aria-pressed="${k === L}">${{ uz: 'UZ', oz: 'ЎЗ', qq: 'QQ', ru: 'RU' }[k]}</button>`).join('')}</div>
    <h1 class="t-h2">${t('Bosh shifokor kabineti')}</h1><p class="c-3 login-sub">${t('Nukus endokrinologiya markazi')}</p>
    <form id="lf"><div class="field"><label class="field-label" for="u">${t('Login')}</label><input class="input" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label class="field-label" for="p">${t('Parol')}</label><input class="input" id="p" name="password" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lerr" role="alert"></div><button class="btn btn-primary btn-block" id="lbtn">${t('Kirish')}</button></form></div>`;
  $('.login-lang').addEventListener('click', (e) => { const b = e.target.closest('[data-l]'); if (b) { setLang(b.dataset.l); login(); } });
  $('#lf').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#lbtn').disabled = true;
    try { await api('login', { method: 'POST', body: { user: $('#u').value, pass: $('#p').value } }); boot(); }
    catch (x) {
      $('#lerr').textContent = x.status === 429 ? t('Juda koʻp urinish. 15 daqiqadan soʻng qayta urinib koʻring.') : x.status === 401 ? t('Login yoki parol notoʻgʻri.') : t('Server bilan aloqa yoʻq. Internetni tekshiring.');
      $('#lbtn').disabled = false; $('#p').select();
    }
  });
  $('#u').focus();
}

async function boot() {
  ME = await api('me');
  applyStatic();
  $('#top').hidden = false;
  try { localStorage.setItem('fikr-auth', '1'); } catch {}
  route();
}

/* ---------- routing, scroll memory ---------- */
const TITLES = { comments: 'Izohlar', people: 'Xodimlar', print: 'QR plakatlar', staff: 'Xodim' };
function route() {
  const [name, arg] = location.hash.slice(2).split('?')[0].split('/');
  const cur = name === 'print' ? 'people' : name === 'staff' ? '' : name || '';
  $$('#nav .seg-item').forEach((a) => { a.setAttribute('aria-selected', a.dataset.r === cur); if (a.dataset.r === cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  movePill();
  document.body.classList.remove('bulk-on');
  app.classList.toggle('wide', name !== 'comments' && name !== 'print');
  app.setAttribute('aria-busy', 'true');
  document.title = t(TITLES[name] || 'Umumiy') + ' — Fikr';
  const views = { staff: () => staffView(arg), comments, people, print: () => printView(arg) };
  const target = goTop ? 0 : scrollMemory()[location.hash.split('?')[0] || '#/'] || 0;
  goTop = false;
  (views[name] || dashboard)()
    .then(() => requestAnimationFrame(() => scrollTo(0, target)))
    .catch((e) => { if (e.message !== 'auth') app.innerHTML = `<p class="err">${t('Maʼlumotni yuklab boʻlmadi. Internetni tekshirib, sahifani yangilang.')}</p>`; })
    .finally(() => { app.removeAttribute('aria-busy'); firstRender = false; });
}
// Reload and Back return to where the doctor was; clicking a nav link starts at the top.
history.scrollRestoration = 'manual';
let goTop = false, firstRender = true;
const scrollMemory = () => { try { return JSON.parse(sessionStorage.getItem('fikr-scroll')) || {}; } catch { return {}; } };
let scrollT;
addEventListener('scroll', () => { clearTimeout(scrollT); scrollT = setTimeout(() => {
  if (app.hasAttribute('aria-busy')) return;
  try { sessionStorage.setItem('fikr-scroll', JSON.stringify({ ...scrollMemory(), [location.hash.split('?')[0] || '#/']: Math.round(scrollY) })); } catch {}
}, 120); }, { passive: true });
document.addEventListener('click', (e) => { if (e.target.closest('a[href^="#/"]')) goTop = true; });

function movePill() {
  const a = $('#nav .seg-item[aria-selected="true"]'), pill = $('#nav .seg-pill');
  if (!a) { pill.style.width = '0'; return; }
  pill.style.cssText = `width:${a.offsetWidth}px;transform:translateX(${a.offsetLeft - 4}px)${firstRender ? ';transition:none' : ''}`; // no slide-in on page load
}
addEventListener('resize', movePill);
addEventListener('keydown', (e) => {
  if (e.key !== '/' || e.target.closest('input, textarea, select') || !$('#q')) return;
  e.preventDefault(); $('#q').focus();
});

/* ---------- motion: entrance only on the first paint of a page load ---------- */
const G = () => (!matchMedia('(prefers-reduced-motion: reduce)').matches && window.gsap) || null;
function animate() {
  const g = firstRender ? G() : null;
  $$('[data-count]').forEach((el) => {
    const to = +el.dataset.count, dec = +(el.dataset.dec || 0);
    if (!g) { el.textContent = to.toFixed(dec); return; }
    const o = { v: 0 }; g.to(o, { v: to, duration: .7, ease: 'power3.out', onUpdate: () => { el.textContent = o.v.toFixed(dec); } });
  });
  if (g) requestAnimationFrame(() => $$('.trk i[data-w]').forEach((i) => { i.style.width = i.dataset.w + '%'; }));
  else $$('.trk i[data-w]').forEach((i) => { i.style.transition = 'none'; i.style.width = i.dataset.w + '%'; });
  if (!g) return;
  g.from('#app .card', { opacity: 0, duration: .35, stagger: .03, ease: 'power2.out', clearProps: 'opacity' }); // fade only: nothing moves under the cursor
  g.from('#chart .cb', { scaleY: 0, transformOrigin: '50% 100%', duration: .6, stagger: .015, ease: 'power3.out', delay: .1 });
  const ln = $('#ln'); if (ln) { const len = ln.getTotalLength(); g.fromTo(ln, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: .8, ease: 'power2.inOut', delay: .2 }); }
}
const num = (v, dec = 0) => (v === null || v === undefined ? '—' : `<span data-count="${v}" data-dec="${dec}">${(+v).toFixed(dec)}</span>`);

function kpis(k, prev) {
  const vs = prev?.partial ? t('1–{d} {m} bilan solishtirilgan', { d: +prev.until.slice(8), m: I18N.monthGen(L, +prev.until.slice(5, 7)) }) : t('oldingi oyga nisbatan');
  const delta = (a, b) => {
    if (a === null || b === null) return `<span class="t-caption c-3">${t('oldingi oyda maʼlumot yoʻq')}</span>`;
    const x = +(a - b).toFixed(2);
    return x === 0 ? `<span class="t-caption c-3">${t('oldingi oy bilan bir xil')}</span>` : `<span class="delta ${x > 0 ? 'delta-up' : 'delta-down'}">${x > 0 ? '↑' : '↓'} ${Math.abs(x)}</span> <span class="t-caption c-3">${vs}</span>`;
  };
  return `<div class="kpis">
    <div class="card kpi"><div class="t-label c-3">${t('Javoblar')}</div><div class="t-kpi">${num(k.n)}</div>${prev ? delta(k.n, prev.n) : ''}</div>
    <div class="card kpi"><div class="t-label c-3">${t('Oʻrtacha baho')}</div><div class="t-kpi">${num(k.avg, 1)} <span class="unit">/ 5</span></div>${prev ? delta(k.avg, prev.avg) : ''}</div>
    <div class="card kpi"><div class="t-label c-3" title="${esc(t('Tavsiya qiladiganlar ulushidan (9–10 ball) tavsiya qilmaydiganlar ulushi (0–6 ball) ayiriladi'))}">${t('Tavsiya indeksi (NPS)')}</div><div class="t-kpi">${num(k.nps)}</div>${prev ? delta(k.nps, prev.nps) : `<span class="t-caption c-3">${t('0 dan yuqori boʻlsa, yaxshi')}</span>`}</div>
    <div class="card kpi${k.flags ? ' alert' : ''}"><div class="t-label c-3">${t('Diqqat talab qiladi')}</div><div class="t-kpi">${num(k.flags)}</div><span class="t-caption c-3">${t('Bemor dori yoki BAD tavsiya qilingani, chek berilmagani yoki xizmat majburlanganini aytgan')}</span></div>
  </div>`;
}

/* ---------- dashboard ---------- */
function greet() { const h = new Date().getHours(); return t(h < 11 ? 'Xayrli tong' : h < 18 ? 'Xayrli kun' : 'Xayrli kech'); }
const hbars = (rows) => rows.map(([label, v, n]) => `<div class="row"><span class="c-2">${esc(label)} <small>${t('{n} ta javob', { n })}</small></span><b class="num">${fmt(v)}</b><div class="trk"><i style="background:${rc(v)}" data-w="${(v / 5) * 100}"></i></div></div>`).join('')
  || `<p class="c-3">${t('Bu oyda javob yoʻq')}</p>`;
function chartSvg(m, daily) {
  const el = $('#chart'), W = Math.max(320, el.clientWidth), H = Math.max(200, el.clientHeight), px = 28, top = 16, ih = H - top - 24;
  const [y, mo] = m.split('-').map(Number), last = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const today = m === ME.month ? +ME.today.slice(8) : last;
  const by = Object.fromEntries(daily.map((d) => [+d.d.slice(8), d])), maxN = Math.max(1, ...daily.map((d) => d.n));
  const step = (W - px * 2) / Math.max(1, last - 1), x = (i) => px + (i - 1) * step, yA = (v) => top + ih - ((v - 1) / 4) * ih, bw = Math.max(4, Math.min(16, step * .6));
  let g = [1, 3, 5].map((v) => `<line class="gl" x1="${px}" x2="${W - px}" y1="${yA(v)}" y2="${yA(v)}"/><text x="0" y="${yA(v) + 4}">${v}</text>`).join('');
  for (let i = 1; i <= today; i++) { const n = by[i]?.n || 0; if (n) g += `<rect class="cb" x="${x(i) - bw / 2}" y="${top + ih - (n / maxN) * ih}" width="${bw}" height="${(n / maxN) * ih}" rx="${Math.min(4, bw / 2)}" style="fill:var(--accent-soft-2)"><title>${esc(I18N.date(L, i, mo))}: ${esc(t('{n} ta javob', { n }))}</title></rect>`; }
  const pts = []; for (let i = 1; i <= today; i++) if (by[i]?.avg != null) pts.push([x(i), yA(by[i].avg), i, by[i].avg]);
  if (pts.length > 1) g += `<path id="ln" d="${pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2"><title>${esc(I18N.date(L, p[2], mo))}: ${esc(t('oʻrtacha baho {v}', { v: p[3] }))}</title></circle>`).join('');
  for (let i = 1; i <= last; i += last > 20 ? 5 : 2) g += `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${i}</text>`;
  el.setAttribute('viewBox', `0 0 ${W} ${H}`); el.innerHTML = g;
}

function summarize(R) {

/* ---------- shared list helpers ---------- */
// escapes text and wraps every search word in <mark>; apostrophe variants count as the same letter
function hl(text, q) {
  const ws = String(q || '').trim().toLowerCase().replace(/[ʻʼ‘’'`´]/g, "'").split(/\s+/).filter((w) => w.length > 1);
  const h = esc(text); if (!ws.length) return h;
  const re = new RegExp('(' + ws.map((w) => w.replace(/[.*+?^${}()|[\]\\&<>"]/g, '\\$&').replace(/'/g, "(?:[ʻʼ‘’`´]|&#39;)")).join('|') + ')', 'gi');
  return h.replace(re, '<mark>$1</mark>');
}
const LAT = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'yo', ж: 'j', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'x', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'sh', ъ: '', ы: 'i', ь: '', э: 'e', ю: 'yu', я: 'ya', ў: 'o', қ: 'q', ғ: 'g', ҳ: 'h' };
// one search key per text: lower case, every apostrophe variant unified, Cyrillic also spelled in Latin
const norm = (s) => { const l = String(s || '').toLowerCase().replace(/[ʻʼ‘’'`´]/g, "'").replace(/\s+/g, ' ').trim(); return l + ' ' + l.replace(/[а-яёўқғҳ]/g, (c) => LAT[c] ?? c); };
// sticky filter bar: the title sits outside it, so sticking never changes page height (that caused a scroll loop)
function stickyBar() {
  stickyBar.io?.disconnect();
  stickyBar.io = new IntersectionObserver(([e]) => $('#pph')?.classList.toggle('stuck', !e.isIntersecting), { rootMargin: `-${$('#top').offsetHeight + 1}px 0px 0px 0px` });
  stickyBar.io.observe($('#ppsent'));
  document.documentElement.style.setProperty('--top-h', $('#top').offsetHeight + 'px');
}
const searchBox = (ph) => `<label class="pp-search">${ICON.search}<input id="q" type="search" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off" enterkeyhint="search"><kbd title="${esc(t('Qidiruvga oʻtish'))}">/</kbd>
  <button type="button" class="pp-clear" id="qx" aria-label="${esc(t('Qidiruvni tozalash'))}" hidden>×</button></label>`;
const emptyState = (title, text, withReset) => `<div class="pp-empty"><h3 class="t-h3">${title}</h3><p class="c-3">${text}</p>${withReset ? `<button class="btn btn-secondary btn-sm" data-reset>${t('Filtrlarni tozalash')}</button>` : ''}</div>`;
function wireSearch(set) {
  $('#q').addEventListener('input', (e) => set({ q: e.target.value }));
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Escape' && e.target.value) { e.target.value = ''; set({ q: '' }); } });
  $('#qx').addEventListener('click', () => { $('#q').value = ''; set({ q: '' }); $('#q').focus(); });
}

        <button class="pp-switch" role="switch" aria-checked="${s.active}" data-sw="${s.id}" aria-label="${esc(t('{name}: QR kod', { name: s.name }))}"><i></i><span>${t(s.active ? 'Faol' : 'Nofaol')}</span></button>
        <span class="pp-act">${actions(s)}</span>
      </div>`).join('') || emptyState(t('Hech kim topilmadi'), t('Qidiruvni qisqartiring yoki filtrlarni tozalang.'), true);
    sync();
  };
  const sync = () => {
    $('#bulk').hidden = !picked.size; document.body.classList.toggle('bulk-on', !!picked.size);
    $('#bulkN').textContent = t('{n} ta tanlandi', { n: picked.size });
  };
  const set = (patch) => {
    Object.assign(PF, patch);
    const q = new URLSearchParams(Object.entries(PF).filter(([k, v]) => v !== PF0[k]));
    history.replaceState(null, '', '#/people' + (q.toString() ? '?' + q : ''));
    draw();
  };
  const save = (s, patch) => api('staff/' + s.id, { method: 'PUT', body: { ...s, ...patch } }).then(() => { Object.assign(s, patch); s._k = key(s); });
  const bulk = async (patch, label) => {
    const ss = [...picked].map((id) => list.find((x) => x.id === id));
    let ok = 0; for (const s of ss) { try { await save(s, patch); ok++; } catch {} }
    toast(ok === ss.length ? t('{n} ta xodim: {what}', { n: ok, what: label }) : t('{all} tadan {ok} tasi saqlandi. Qolganini qayta urinib koʻring.', { all: ss.length, ok }));
    picked.clear(); draw();
  };

  wireSearch(set);
  $('#fd').addEventListener('change', (e) => set({ dept: e.target.value }));
  $('#ft').addEventListener('change', (e) => set({ tpl: e.target.value }));
  $('#fs').addEventListener('change', (e) => set({ sort: e.target.value }));
  $('#fst').addEventListener('click', (e) => { const b = e.target.closest('[data-st]'); if (b) set({ st: b.dataset.st }); });
  const reset = () => { ['q', 'fd', 'ft'].forEach((id) => { $('#' + id).value = ''; }); $('#fs').value = 'name'; set({ ...PF0 }); };
  $('#reset').addEventListener('click', reset);
  $('#rows').addEventListener('click', async (e) => {
    if (e.target.closest('[data-reset]')) return reset();
    const ed = e.target.closest('[data-edit]'); if (ed) return edit(list.find((s) => s.id === +ed.dataset.edit));
    const sw = e.target.closest('[data-sw]'); if (!sw) return;
    const s = list.find((x) => x.id === +sw.dataset.sw), on = !s.active, row = sw.closest('.pp-row');
    sw.setAttribute('aria-checked', on); sw.disabled = true;
    // update the row in place: redrawing would make it vanish from the "Faol" filter under the cursor
    try { await save(s, { active: on }); toast(on ? t('{name}: QR kod yana ishlayapti', { name: s.name }) : t('{name}: QR kod oʻchirildi, bemorlar endi baholay olmaydi. Qaytarish uchun tugmani yana bosing.', { name: s.name }), on ? 2400 : 5000); }
    catch { toast(t('Saqlab boʻlmadi. Internetni tekshiring.')); }
    sw.disabled = false; sw.setAttribute('aria-checked', s.active); $('span', sw).textContent = t(s.active ? 'Faol' : 'Nofaol');
    row.classList.toggle('off', !s.active);
    $('.pp-act', row).innerHTML = actions(s);
    counts();
  });
  $('#rows').addEventListener('change', (e) => {
    if (!e.target.classList.contains('pick')) return;
    const id = +e.target.value; e.target.checked ? picked.add(id) : picked.delete(id);
    e.target.closest('.pp-row').classList.toggle('sel', e.target.checked); sync();
  });
  $('#rows').addEventListener('focusout', async (e) => {
    const inp = e.target.closest('.dept-in'); if (!inp) return;
    const s = list.find((x) => x.id === +inp.dataset.id), v = inp.value.trim();
    if (v === s.dept) return;
    try { await save(s, { dept: v }); toast(v ? t('Boʻlim saqlandi: {d}', { d: v }) : t('Boʻlim olib tashlandi')); counts(); }
    catch { inp.value = s.dept; toast(t('Saqlab boʻlmadi. Internetni tekshiring.')); }
  });
  $('#rows').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest('.dept-in')) e.target.blur(); });
  $('#bulkGo').addEventListener('click', () => { const v = $('#bulkDept').value.trim(); if (!v) { $('#bulkDept').focus(); return toast(t('Avval boʻlim nomini yozing')); } bulk({ dept: v }, t('boʻlim “{d}”', { d: v })); });
  $('#bulkOn').addEventListener('click', () => bulk({ active: true }, t('faol qilindi')));
  $('#bulkOff').addEventListener('click', () => bulk({ active: false }, t('nofaol qilindi')));
  $('#bulkPr').addEventListener('click', () => { location.hash = '#/print/' + [...picked].join(','); });
  $('#bulkX').addEventListener('click', () => { picked.clear(); draw(); });
  $('#add').addEventListener('click', () => edit(null));
  draw();
}

function edit(s) {
  const f = $('#form'), dlg = $('#dlg'), opener = document.activeElement;
  $('#dlgTitle').textContent = t(s ? 'Tahrirlash' : 'Yangi xodim yoki joy');
  f.elements.name.value = s?.name || ''; f.elements.position.value = s?.position || ''; f.elements.dept.value = s?.dept || '';
  f.elements.template.value = s?.template || 'doctor'; f.elements.point.checked = s?.kind === 'point'; f.elements.active.checked = s ? s.active : true;
  dlg.onclose = async () => {
    opener?.focus?.();
    if (dlg.returnValue !== 'ok') return;
    const e = f.elements;
    const body = { name: e.name.value, position: e.position.value, dept: e.dept.value, template: e.template.value, kind: e.point.checked ? 'point' : 'person', active: e.active.checked };
    try { await api(s ? 'staff/' + s.id : 'staff', { method: s ? 'PUT' : 'POST', body }); toast(t('Saqlandi')); people(); }
    catch { toast(t('Saqlab boʻlmadi. Ism va soʻrovnomani tekshiring.')); }
  };
  dlg.returnValue = ''; dlg.showModal();
}

/* ---------- printable A4 posters, modelled on the center's own design ---------- */
// doctors' posters show their department, else their specialty (dept and position are free text in ru / uz),
// else the survey's generic photo; first match wins, so the narrower stems come first;
// "жарроҳдан (врач-хирургдан) ташқари" means "other than surgeons", hence the surgeon stems are exact
const PHOTO_BY = [[/нефр|nefr/i, 'nephro'], [/диабетолог|diabetolog/i, 'diabetology'], [/детск|болалар|bolalar|педиатр|pediatr/i, 'pediatric'],
  [/реаним|интенсив|reanim/i, 'icu'], [/тиро|щитовид|tiroid|qalqon/i, 'thyroid'], [/пластич|реконструк|plastik|тубиг|tubig|шифокор-жарроҳ|врач-хирург\)|jarroh(?!dan)/i, 'surgery'],
  [/физио|fizio/i, 'physio'], [/кардио|kardio/i, 'cardio'], [/офтальм|окулист|oftalm|okulist/i, 'eye'], [/невр|nevr/i, 'neuro'],
  [/диет|diet/i, 'diet'], [/цитолог|лаборант|sitolog|laborant/i, 'lab']];
function posterPhoto(s) {
  if (s.template !== 'doctor') return s.template;
  for (const text of [s.dept, s.position]) { const hit = PHOTO_BY.find(([re]) => re.test(text || '')); if (hit) return 'd/' + hit[1]; }
  return 'doctor';
}
const POSTER_ICONS = {
  shield: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M24 5l15 6v11c0 10-6.5 17.5-15 21C15.5 39.5 9 32 9 22V11z"/><path d="M17 24l5 5 9-10" class="pz-hi"/></svg>',
  chat: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="M24 7c10.5 0 18 6.7 18 15s-7.5 15-18 15c-2.2 0-4.3-.3-6.2-.9L9 40l2.6-7.2C8.1 30 6 26.2 6 22 6 13.7 13.5 7 24 7z"/><g class="pz-fill"><circle cx="17" cy="22" r="2"/><circle cx="24" cy="22" r="2"/><circle cx="31" cy="22" r="2"/></g></svg>',
  growth: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 40h32M12 40V30h6v10M21 40V24h6v16M30 40V18h6v22"/><path d="M10 22l10-8 7 5 13-11M33 8h7v7" class="pz-hi"/></svg>',
  heart: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M24 22s-9-5.5-9-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-9 11-9 11z" class="pz-fill pz-hi"/><path d="M6 30l7-4c2-1 4-1 6 0l7 3c1.5.6 1.5 2.7 0 3l-6 1M42 30l-7-4c-2-1-4-1-6 0M6 30v10h8l8-3 10 2 10-9"/></svg>',
  phone: '<svg viewBox="0 0 32 48" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="3" y="2" width="26" height="44" rx="5"/><path d="M13 41h6"/><path d="M10 13h5v5h-5zM17 13h5v5h-5zM10 20h5v5h-5zM18 21h3v3h-3z" stroke-width="1.8"/></svg>',
  pulse: '<svg viewBox="0 0 300 20" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M0 10h120l8-8 10 16 8-14 6 6h148"/></svg>',
};
// back art (waves, dots), the photo as a plain <img> so the PDF keeps it as JPEG (an SVG <image> gets re-encoded lossless, ~1.5 MB a page), front art (band) and the navy band, all in mm (viewBox = the A4 sheet)
const posterArt = (id, photo) => `<svg class="pz-art" viewBox="0 0 210 297" aria-hidden="true">
  <defs><linearGradient id="pzb${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF2FF"/></linearGradient>
    <radialGradient id="pzr${id}" cx="1" cy="0" r=".7"><stop offset="0" stop-color="#D9E8FF"/><stop offset="1" stop-color="#D9E8FF" stop-opacity="0"/></radialGradient>
    <pattern id="pzd${id}" width="4.2" height="4.2" patternUnits="userSpaceOnUse"><circle cx="2.1" cy="2.1" r=".55" fill="#3D8BFF" fill-opacity=".45"/></pattern>
</defs>
  <rect width="210" height="297" fill="url(#pzb${id})"/><rect width="210" height="150" fill="url(#pzr${id})"/>
  <rect x="134" y="9" width="27" height="17" fill="url(#pzd${id})"/><rect x="2" y="128" width="9" height="46" fill="url(#pzd${id})"/>
  <path d="M210 36C172 39 140 54 121 79C101 105 90 140 86 178L83 242H210Z" fill="#DCE9FF"/>
  <path d="M210 42C175 45 145 59 127 83C108 108 97 141 93 178L90 242H210Z" fill="#fff"/>
</svg>
<img class="pz-photo" src="/a/p/${photo}.jpg?v={{V}}" alt="">
<svg class="pz-art" viewBox="0 0 210 297" aria-hidden="true"><defs><linearGradient id="pzn${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A2668"/><stop offset="1" stop-color="#103A93"/></linearGradient></defs>
  <path d="M210 48C178 51 151 64 134 86C116 110 105 142 101 178L98 240" fill="none" stroke="#3D8BFF" stroke-width=".9"/>
  <path d="M164.5 35.5A19 19 0 1 1 194 43" fill="none" stroke="#3D8BFF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M0 233C38 222 86 219 128 228C164 235 190 232 210 222V276H0Z" fill="#3D8BFF"/>
  <path d="M0 239C42 228 92 226 134 234C170 240 192 237 210 229V276H0Z" fill="url(#pzn${id})"/>
  <path d="M0 276H210V297H0Z" fill="#fff"/>
  <path d="M146 297C170 292 192 283 210 271V297Z" fill="#3D8BFF"/><path d="M166 297C183 293 198 287 210 279V297Z" fill="#1D5FE0"/>
  <path d="M46 289.6C74 287.8 104 287.8 132 289.6" fill="none" stroke="#3D8BFF" stroke-width=".5" stroke-linecap="round"/>
</svg>`;
async function printView(ids) {
  STATS = STATS || await api('stats?month=' + month());
  const want = new Set(String(ids).split(',').map(Number)), list = STATS.staff.filter((s) => want.has(s.id) && s.active);
  // level Q survives a crease or a smudge on a printed sheet better than M
  const qr = (url) => { const q = qrcode(0, 'Q'); q.addData(url); q.make(); return q.createSvgTag({ cellSize: 8, margin: 0, scalable: true }); };
  const P = I18N.poster(L);
  app.innerHTML = `<div class="head noprint"><div><a class="back" href="#/people">${ICON.back}${t('Xodimlar')}</a><h1 class="t-h1">${t('QR plakatlar ({n})', { n: list.length })}</h1>
      <p class="c-3">${t('A4, har biri alohida sahifada. Chop etishda “Масштаб 100%” va “Фоновая графика / Background graphics” yoqilgan boʻlsin.')}</p></div>
      <button class="btn btn-primary" id="doPrint">${t('Chop etish yoki PDF')}</button></div>
    <div class="posters">${list.map((s) => { const url = `${ME.base}/s/${s.code}`, [l1, l2] = P.title[s.template] || P.title.doctor;
      // like the center's poster, only the last word ("BAHOLANG!") is the big blue line
      const cut = l2.lastIndexOf(' '), head = cut < 0 ? l1 : `${l1} ${l2.slice(0, cut)}`, accent = l2.slice(cut + 1); return `<article class="poster" lang="${I18N.HTML_LANG[L]}">${posterArt(s.id, posterPhoto(s))}
      <div class="pz-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><defs><linearGradient id="pzp${s.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F9BFF"/><stop offset="1" stop-color="#1D5FE0"/></linearGradient></defs><path d="M9 2.5h6v6.5h6.5v6H15v6.5H9V15H2.5V9H9z" fill="url(#pzp${s.id})" stroke="#fff" stroke-width=".5" stroke-linejoin="round"/></svg></div>
      <div class="pz-col"><h2 class="pz-title">${esc(head)}<em>${esc(accent)}</em></h2><i class="pz-pulse">${POSTER_ICONS.pulse}</i>
        <p class="pz-sub">${esc(P.sub1)}<br>${esc(P.sub2)}</p>
        <div class="pz-qr"><div class="pz-tab">${POSTER_ICONS.phone}<span>${esc(P.scan)}</span></div>
          <div class="pz-card"><div class="pz-code">${qr(url)}</div>
          ${s.kind === 'point' ? '' : `<div class="pz-name"><b>${esc(s.name)}</b>${s.dept ? `<span>${esc(s.dept)}</span>` : ''}</div>`}</div></div></div>
      <ul class="pz-band">${P.features.map(([ic, h]) => `<li>${POSTER_ICONS[ic]}<b>${esc(h)}</b></li>`).join('')}</ul>
      <p class="pz-thanks">${esc(P.thanks)}</p>
      <p class="pz-url">${esc(url.replace(/^https?:\/\//, ''))}</p></article>`; }).join('')}</div>`;
  $('#doPrint').addEventListener('click', () => print());
  // a long title or a two-line department can push the card into the wave (top ≈ 236mm): shrink that sheet's QR, never below 66mm
  const mm = 96 / 25.4;
  $$('.poster').forEach((p) => {
    // one long accent word ("ПОЛИКЛИНИКУ!") must not run into the round logo
    const em = $('.pz-title em', p), col = $('.pz-col', p);
    for (let f = 21; em.scrollWidth > col.clientWidth && f > 13; f -= 1) em.style.fontSize = f - 1 + 'mm';
    const q = $('.pz-qr', p), over = () => $('.pz-card', p).getBoundingClientRect().bottom - p.getBoundingClientRect().top - 234 * mm;
    for (let w = 100; over() > 0 && w > 76; w -= 4) q.style.width = w - 4 + 'mm';
  });
  fitPosters();
}
// A4 is 210mm wide; on a phone the sheet is shrunk to the screen, print resets zoom to 1
function fitPosters() {
  const box = $('.posters'); if (!box) return;
  const z = Math.min(1, box.clientWidth / (210 * 96 / 25.4));
  box.querySelectorAll('.poster').forEach((p) => { p.style.zoom = z; });
}
addEventListener('resize', fitPosters);

/* ---------- header controls ---------- */
function setMonth(m) {
  $('#month').value = m;
  $('#mLabel').textContent = monthName(m);
  $('#mNext').disabled = m >= ME.month;
}
const stepMonth = (d) => { const [y, mo] = month().split('-').map(Number); setMonth(new Date(Date.UTC(y, mo - 1 + d, 1)).toISOString().slice(0, 7)); route(); };
$('#mPrev').addEventListener('click', () => stepMonth(-1));
$('#mNext').addEventListener('click', () => stepMonth(1));
function syncTheme() { const label = t(document.documentElement.dataset.theme === 'dark' ? 'Yorugʻ rejimni yoqish' : 'Qorongʻi rejimni yoqish'); $('#theme').setAttribute('aria-label', label); $('#theme').title = label; }
$('#theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('fikr-theme', next); } catch {}
  syncTheme();
});
function setLang(l) { L = l; try { localStorage.setItem('fikr-lang', l); } catch {} applyStatic(); }
$('#lang').addEventListener('change', (e) => { setLang(e.target.value); if (ME) route(); });
$('#logout').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }).catch(() => {}); login(); });
addEventListener('hashchange', () => { if (ME) route(); });
applyStatic();
addEventListener('DOMContentLoaded', () => boot().catch(() => {}));
</script>
